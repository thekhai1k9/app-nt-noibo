<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:#0B6E7F}a:hover{color:#08515e}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 860px; background: #F2F4F7; color: #101828; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <section style="flex: 1 1 480px; box-sizing: border-box; padding: 64px; background: #0B6E7F; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E7F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      </div>
      <span style="font-size: 20px; font-weight: 700">Kết Nối</span>
    </div>
    <div style="max-width: 460px">
      <h1 style="margin: 0 0 16px; font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Mọi chi nhánh, một cuộc trò chuyện.</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #CFEAEE">Nhắn tin nội bộ giữa Hà Nội, Đà Nẵng và TP.HCM. Dữ liệu nằm trên máy chủ của công ty bạn.</p>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <span style="padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,0.14); font-size: 13px; font-weight: 500">Hà Nội</span>
      <span style="padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,0.14); font-size: 13px; font-weight: 500">Đà Nẵng</span>
      <span style="padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,0.14); font-size: 13px; font-weight: 500">TP.HCM</span>
    </div>
  </section>

  <section style="flex: 1 1 480px; box-sizing: border-box; padding: 48px 24px; display: flex; align-items: center; justify-content: center">
    <form style="width: 100%; max-width: 400px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 20px; padding: 36px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div>
        <h2 style="margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Đăng nhập</h2>
        <p style="margin: 0; color: #596579">Dùng tài khoản do quản trị viên cấp.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="u" style="font-weight: 600; font-size: 13px; color: #344054">Tên đăng nhập</label>
        <input id="u" type="text" autocomplete="username" value="long.pham" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 12px; font: inherit; color: #101828; outline-color: #0B6E7F">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="p" style="font-weight: 600; font-size: 13px; color: #344054">Mật khẩu</label>
        <input id="p" type="password" autocomplete="current-password" value="matkhau123" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 12px; font: inherit; color: #101828; outline-color: #0B6E7F">
      </div>

      <button type="submit" style="height: 48px; border: 0; border-radius: 12px; background: #0B6E7F; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Đăng nhập</button>

      <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F2F4F7; color: #475467; font-size: 13px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Quên mật khẩu hoặc chưa có tài khoản? Liên hệ quản trị viên của chi nhánh bạn.</span>
      </div>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
